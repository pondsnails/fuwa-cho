<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffffff">
<title>わたあめ帳</title>
<style>
/* レジアプリ（Airレジの注文入力画面）に寄せた見た目。白い帯＋薄い罫線、角の立ったタイルに色の下線、操作は青1色。 */
:root{
  color-scheme:light;
  --bg:#eff1f2; --panel:#ffffff; --strip:#f6f7f8; --ink:#333a40; --muted:#8a9198; --line:#dfe3e6;
  --blue:#1fa9e0; --blue-press:#1789b8; --danger:#e8452c;
  --f-plain:#a3abb1; --f-ichigo:#ee5a7c; --f-grape:#8a5bc2; --f-blue:#2a7fc0; --f-lemon:#e3b90f; --f-orange:#f59a38;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%}
.wrap{max-width:520px;margin:0 auto;padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

header{position:relative;display:flex;align-items:center;justify-content:center;height:44px;padding-top:env(safe-area-inset-top,0px);box-sizing:content-box;background:var(--panel);border-bottom:1px solid var(--line)}
h1{margin:0;font-size:15px;font-weight:700;letter-spacing:.04em}
.mode{position:absolute;right:12px;bottom:13px;font-size:11px;color:var(--blue)}
.mode.bad{color:var(--danger);font-weight:700}
.stats{display:flex;background:var(--panel);border-bottom:1px solid var(--line)}
.stats span{flex:1;padding:7px 0 8px;text-align:center;font-size:11px;color:var(--muted)}
.stats span+span{border-left:1px solid var(--line)}
.stats b{display:block;font-size:20px;font-weight:600;line-height:1.2;color:var(--ink);font-variant-numeric:tabular-nums}

h2,summary{margin:0;padding:7px 14px;font-size:12px;font-weight:400;color:var(--muted);background:var(--strip);border-bottom:1px solid var(--line)}
.menu{padding:12px 12px 14px}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-height:68px;padding:0 2px;background:var(--panel);border:1px solid var(--c);border-bottom-width:4px;border-radius:3px}
.tile:active{background:#e4f4fb}
.tile:disabled{opacity:.45}
.tile .name{font-size:14px;font-weight:600;white-space:nowrap}
.tile .price{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.tile.wide{grid-column:1 / -1;flex-direction:row;gap:10px;min-height:52px;--c:var(--blue);color:var(--blue)}
.tile.wide .price{color:inherit;opacity:.8}
.tile.on,.tile.on:active{background:var(--blue);color:#fff}
.hint{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;font-size:14px;font-weight:700}

.list{background:var(--panel);border-top:1px solid var(--line)}
.o{display:grid;grid-template-columns:2.2em minmax(0,1fr) auto;gap:8px;align-items:center;min-height:60px;padding:8px 10px 8px 14px;border-bottom:1px solid var(--line)}
.o .no{font-weight:700;font-size:22px;font-variant-numeric:tabular-nums}
.o .nm{font-weight:600;font-size:15px;overflow-wrap:anywhere}
.o .nm small{display:block;font-weight:400;font-size:11px;color:var(--muted)}
.o .r{display:flex;gap:6px;align-items:center}
.sq{display:inline-block;width:10px;height:10px;margin-right:5px;border-radius:2px}
.mk{width:46px;height:44px;border-radius:3px;background:var(--blue);color:#fff;font-weight:700;font-size:17px}
.mk:active{background:var(--blue-press)}
.x{min-width:34px;height:44px;color:var(--muted);font-size:20px}
.x.arm{color:var(--danger);font-size:14px;font-weight:700;padding:0 4px}
.link{color:var(--blue);font-size:14px;min-height:44px;padding:0 6px}
.who{display:inline-block;min-width:1.6em;text-align:center;font-weight:700}
.none{padding:14px;border-bottom:1px solid var(--line);color:var(--muted);font-size:14px}

details{background:var(--panel)}
summary{cursor:pointer}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:9px 14px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
td:first-child,th:first-child{text-align:left}
th{font-weight:400;font-size:12px;color:var(--muted)}
tfoot td{font-weight:700;font-size:16px}
.sub{font-size:14px;color:var(--muted);padding:10px 14px;border-bottom:1px solid var(--line)}
.sub b{color:var(--ink);margin-right:10px}
/* 番号の表示は、レジの客面ディスプレイと同じ黒地に白。 */
.toast{position:fixed;left:16px;right:16px;top:calc(8px + env(safe-area-inset-top,0px));margin:0 auto;max-width:420px;padding:12px 16px;border-radius:3px;background:#16191c;color:#fff;font-weight:700;font-size:18px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>わたあめ帳</h1><span class="mode" id="mode">読み込み中</span></header>
  <div class="stats" id="stats"></div>

  <section aria-labelledby="hMenu">
    <h2 id="hMenu">注文入力</h2>
    <div class="menu">
      <div id="hint"></div>
      <div class="tiles" id="tiles"></div>
    </div>
  </section>

  <section class="list" aria-labelledby="hQueue">
    <h2 id="hQueue">未伝達　伝えた相手を押す</h2>
    <div id="queue"></div>
  </section>

  <details id="dDone"><summary id="doneSum">伝達済み</summary><div id="done"></div></details>
  <details id="dSales"><summary>集計</summary><div id="sales"></div></details>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>
(function(){
// Firebase Realtime Database のURL。空のままだと、この端末だけに保存する。
const DB_URL='https://wataame-cho-default-rtdb.asia-southeast1.firebasedatabase.app';
// true にすると日付ごとに番号と集計を分ける（毎日1番から）。
const SPLIT_BY_DATE=true;

const $=s=>document.querySelector(s);
const yen=n=>'¥'+Number(n||0).toLocaleString('ja-JP');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const hm=t=>{const d=new Date(t||0);return d.getHours()+':'+String(d.getMinutes()).padStart(2,'0')};
const FLAVORS=[
  {id:'plain',name:'プレーン',price:200,c:'--f-plain'},
  {id:'ichigo',name:'いちご',price:300,c:'--f-ichigo'},
  {id:'grape',name:'グレープ',price:300,c:'--f-grape'},
  {id:'blue',name:'ブルーハワイ',price:300,c:'--f-blue'},
  {id:'lemon',name:'レモン',price:300,c:'--f-lemon'},
  {id:'orange',name:'オレンジ',price:300,c:'--f-orange'}
];
const DOUBLE=400, F=Object.fromEntries(FLAVORS.map(f=>[f.id,f]));
function dayKey(){if(!SPLIT_BY_DATE)return 'all';const d=new Date();return 'd'+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')}
const DAY=dayKey();
const BASE=DB_URL?DB_URL.replace(/\/+$/,'')+'/wataame/'+DAY:'';
const LS='wataame-cho-v3-'+DAY;

// server: 保存済みの注文（id→注文）。pend: まだ送れていない変更（id→差分）。
let server={}, pend={}, online=false, loaded=false, es=null, lastBeat=0, t0=Date.now();
let dbl=null, armCancel=null, busy=false, toastT=0, flushing=false, again=false;

function loadLocal(){try{const x=JSON.parse(localStorage.getItem(LS)||'null');if(x){if(!BASE)server=x.server||{};pend=x.pend||{}}}catch(e){}}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(BASE?{pend}:{server,pend:{}}))}catch(e){}}
function toast(msg,ms){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{t.hidden=true},ms||1600)}
function fail(){toast('保存できなかった。電波を確認してもう一度',4000)}

function req(method,path,body,headers){
  const c=new AbortController(),t=setTimeout(()=>c.abort(),8000);
  return fetch(BASE+path,{method,body:body===undefined?undefined:JSON.stringify(body),headers,signal:c.signal,cache:'no-store'}).finally(()=>clearTimeout(t));
}
const list=()=>Object.keys(server).map(id=>Object.assign({},server[id],pend[id],{id})).filter(o=>o&&o.no!=null);
const nextNo=()=>Object.keys(server).reduce((a,id)=>Math.max(a,Number(server[id]&&server[id].no)||0),0)+1;

// 番号そのものをキーにして「まだ無いときだけ書く」ので、2台同時でも同じ番号にはならない。
async function addRemote(o){
  let no=nextNo(),net=0;
  for(let i=0;i<60;i++){
    o.no=no;let r;
    try{r=await req('PUT','/orders/n'+no+'.json',o,{'if-match':'null_etag'})}
    catch(e){if(++net>=3)throw e;await sleep(700);continue}
    if(r.ok){server['n'+no]=Object.assign({},o);return}
    if(r.status===412){
      let cur=null;try{cur=await r.json()}catch(e){}
      if(cur){server['n'+no]=cur;if(cur.cid===o.cid)return}
      no=Math.max(no+1,nextNo());continue;
    }
    throw new Error('http '+r.status);
  }
  throw new Error('busy');
}
async function addOrder(o){
  if(BASE){if(!loaded)throw new Error('not loaded');await addRemote(o)}
  else{o.no=nextNo();server['n'+o.no]=o;saveLocal()}
}
function patchOrder(id,patch){
  if(BASE){pend[id]=Object.assign({},pend[id],patch);saveLocal();render();flush()}
  else{if(server[id])Object.assign(server[id],patch);saveLocal();render()}
}
// 送れていない変更を順に再送する。失敗したら残しておき、次の機会にもう一度。
async function flush(){
  if(!BASE)return;
  if(flushing){again=true;return}
  flushing=true;
  do{
    again=false;
    for(const id of Object.keys(pend)){
      const snap=JSON.stringify(pend[id]);
      try{
        const r=await req('PATCH','/orders/'+id+'.json',pend[id]);
        if(!r.ok)throw new Error('http '+r.status);
        if(server[id])Object.assign(server[id],JSON.parse(snap));
        if(JSON.stringify(pend[id])===snap)delete pend[id];else again=true;
      }catch(e){again=false;break}
    }
  }while(again);
  saveLocal();flushing=false;render();
}

function setPath(path,data){
  const seg=path.split('/').filter(Boolean);
  if(!seg.length){server=data||{};return}
  let t=server;
  for(let i=0;i<seg.length-1;i++){if(typeof t[seg[i]]!=='object'||t[seg[i]]===null)t[seg[i]]={};t=t[seg[i]]}
  const k=seg[seg.length-1];
  if(data===null)delete t[k];else t[k]=data;
}
function beat(){lastBeat=Date.now();if(!online){online=true;flush()}}
function connect(){
  if(es)es.close();
  lastBeat=Date.now();
  es=new EventSource(BASE+'/orders.json');
  es.addEventListener('put',e=>{const m=JSON.parse(e.data);setPath(m.path,m.data);loaded=true;beat();render()});
  es.addEventListener('patch',e=>{const m=JSON.parse(e.data);Object.keys(m.data||{}).forEach(k=>setPath(m.path+'/'+k,m.data[k]));beat();render()});
  es.addEventListener('keep-alive',()=>{beat();renderMode()});
  es.onerror=()=>{online=false;renderMode();if(es.readyState===2){const me=es;setTimeout(()=>{if(es===me)connect()},3000)}};
}

const flv=o=>Array.isArray(o.flavors)?o.flavors:Object.values(o.flavors||{});
const live=()=>list().filter(o=>o.status!=='cancel');
const fl=o=>flv(o).map(f=>F[f]?F[f].name:f).join('＋');
const label=o=>(o.kind==='double'?'ダブル ':'')+fl(o);
const dots=o=>flv(o).map(f=>'<i class="sq" style="background:var('+(F[f]?F[f].c:'--line')+')"></i>').join('');

function renderTiles(){
  const off=busy?' disabled':'';
  $('#hint').innerHTML=dbl?'<div class="hint"><span>ダブル：'+(dbl.length?esc(F[dbl[0]].name)+'＋2つ目':'1つ目')+'を選ぶ</span><button class="link" data-act="dblOff">やめる</button></div>':'';
  $('#tiles').innerHTML=FLAVORS.map(f=>'<button class="tile" style="--c:var('+f.c+')" data-act="pick" data-id="'+f.id+'"'+off+'><span class="name">'+f.name+'</span>'+(dbl?'':'<span class="price">¥'+f.price+'</span>')+'</button>').join('')
    +'<button class="tile wide'+(dbl?' on':'')+'" data-act="dbl"'+off+'><span class="name">ダブル</span><span class="price">¥'+DOUBLE+'</span></button>';
}
function renderQueue(){
  const w=list().filter(o=>o.status==='new').sort((a,b)=>a.no-b.no);
  const el=$('#queue');
  if(!w.length){el.innerHTML='<div class="none">なし</div>';return}
  el.innerHTML=w.map(o=>'<div class="o"><span class="no">'+esc(o.no)+'</span>'
    +'<span class="nm">'+dots(o)+esc(fl(o))+'<small>'+(o.kind==='double'?'ダブル　':'')+hm(o.createdAt)+'</small></span>'
    +'<span class="r">'+['A','B','C'].map(m=>'<button class="mk" data-act="told" data-m="'+m+'" data-id="'+esc(o.id)+'" aria-label="製造'+m+'に伝えた">'+m+'</button>').join('')
    +(armCancel===o.id?'<button class="x arm" data-act="cancel2" data-id="'+esc(o.id)+'">取消</button>':'<button class="x" data-act="cancel" data-id="'+esc(o.id)+'" aria-label="'+esc(o.no)+'番を取り消す">×</button>')
    +'</span></div>').join('');
}
function renderDone(){
  const d=list().filter(o=>o.status==='told').sort((a,b)=>(b.toldAt||0)-(a.toldAt||0));
  $('#doneSum').textContent='伝達済み '+d.length;
  $('#done').innerHTML=d.length?d.slice(0,50).map(o=>'<div class="o"><span class="no">'+esc(o.no)+'</span><span class="nm">'+esc(label(o))+'</span><span class="r"><span class="who">'+esc(o.maker||'?')+'</span><button class="link" data-act="undo" data-id="'+esc(o.id)+'">戻す</button></span></div>').join(''):'<div class="none">なし</div>';
}
function renderSales(){
  const by={},mk={A:0,B:0,C:0};let tq=0,tt=0;
  live().forEach(o=>{const k=o.kind==='double'?'ダブル':fl(o);by[k]=by[k]||{q:0,t:0};by[k].q++;by[k].t+=o.total;tq++;tt+=o.total;if(o.status==='told'&&o.maker in mk)mk[o.maker]++});
  const rows=FLAVORS.map(f=>f.name).concat('ダブル').filter(k=>by[k]).map(k=>'<tr><td>'+esc(k)+'</td><td>'+by[k].q+'</td><td>'+yen(by[k].t)+'</td></tr>').join('');
  $('#sales').innerHTML='<table><thead><tr><th>商品</th><th>個数</th><th>金額</th></tr></thead><tbody>'+rows+'</tbody><tfoot><tr><td>合計</td><td>'+tq+'</td><td>'+yen(tt)+'</td></tr></tfoot></table><div class="sub">伝えた数　A <b>'+mk.A+'</b>B <b>'+mk.B+'</b>C <b>'+mk.C+'</b></div>';
  $('#stats').innerHTML='<span><b>'+list().filter(o=>o.status==='new').length+'</b>未伝達</span><span><b>'+tq+'</b>注文</span><span><b>'+yen(tt)+'</b>売上</span>';
}
function renderMode(){
  const n=Object.keys(pend).length,el=$('#mode');
  let t,bad=true;
  if(!BASE){t='この端末のみ保存';bad=false}
  else if(n)t='未送信 '+n+'件・再送中';
  else if(!loaded&&Date.now()-t0<8000){t='読み込み中';bad=false}
  else if(!loaded||!online)t='つながらない・再接続中';
  else{t='共有・自動保存';bad=false}
  el.textContent=t;el.classList.toggle('bad',bad);
}
function render(){renderTiles();renderQueue();renderDone();renderSales();renderMode()}

async function take(kind,flavors){
  if(busy)return;
  const o={no:0,kind,flavors,total:kind==='double'?DOUBLE:F[flavors[0]].price,status:'new',createdAt:Date.now(),cid:Date.now().toString(36)+Math.random().toString(36).slice(2,8)};
  busy=true;dbl=null;renderTiles();
  try{await addOrder(o);toast(o.no+'番　'+label(o))}catch(e){fail()}
  busy=false;render();
}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  const a=b.dataset.act,id=b.dataset.id;
  if(a==='pick'){if(dbl){dbl.push(id);if(dbl.length===2)take('double',dbl.slice());else renderTiles()}else take('single',[id])}
  else if(a==='dbl'){dbl=dbl?null:[];renderTiles()}
  else if(a==='dblOff'){dbl=null;renderTiles()}
  else if(a==='told')patchOrder(id,{status:'told',maker:b.dataset.m,toldAt:Date.now()});
  else if(a==='undo')patchOrder(id,{status:'new'});
  else if(a==='cancel'){armCancel=id;renderQueue();setTimeout(()=>{if(armCancel===id){armCancel=null;renderQueue()}},3000)}
  else if(a==='cancel2'){armCancel=null;patchOrder(id,{status:'cancel'})}
});

function wake(){
  if(!BASE)return;
  if(dayKey()!==DAY){location.reload();return}
  if(!es||es.readyState===2||Date.now()-lastBeat>45000)connect();
  flush();
}
loadLocal();render();
if(BASE){
  connect();
  // Firebaseは30秒ごとに keep-alive を送る。途絶えたらつなぎ直す。
  setInterval(()=>{if(Date.now()-lastBeat>75000){online=false;connect()}flush();renderMode()},15000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)wake()});
  window.addEventListener('online',wake);
  window.addEventListener('pageshow',e=>{if(e.persisted)wake()});
}
})();
</script>
</body>
</html>
