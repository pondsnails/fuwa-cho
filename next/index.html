<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffffff">
<link rel="icon" type="image/png" sizes="32x32" href="../icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="../icon-192.png">
<link rel="apple-touch-icon" href="../icon-180.png">
<title>わたあめ帳（来年版）</title>
<style>
/* レジアプリ（Airレジの注文入力画面）に寄せた見た目。白い帯＋薄い罫線、角の立ったタイルに色の下線、操作は青1色。
   画面は上から 見出し／切り替え／一覧（ここだけスクロール）／注文ボタン。注文ボタンは親指の届く下に固定する。 */
:root{
  color-scheme:light;
  --bg:#eff1f2; --panel:#ffffff; --strip:#f6f7f8; --ink:#333a40; --muted:#8a9198; --line:#dfe3e6;
  --blue:#1fa9e0; --blue-press:#1789b8; --danger:#e8452c;
  --f-plain:#a3abb1; --f-ichigo:#ee5a7c; --f-grape:#8a5bc2; --f-blue:#2a7fc0; --f-lemon:#e3b90f; --f-orange:#f59a38;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;background:var(--bg);color:var(--ink);font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%}
.app{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:520px;margin:0 auto;background:var(--panel)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

header{flex:none;display:flex;align-items:center;justify-content:space-between;height:40px;padding:env(safe-area-inset-top,0px) 14px 0;box-sizing:content-box}
h1{margin:0;font-size:15px;font-weight:700;letter-spacing:.04em}
h1 span{margin-left:8px;font-size:12px;font-weight:400;letter-spacing:0;color:var(--muted)}
.mode{margin-left:auto;font-size:11px;color:var(--muted)}
.helpbtn{margin:0 -8px 0 6px;padding:0 8px;height:40px;font-size:13px;color:var(--blue)}
.helpbtn:active{background:#d9eff9}
.helpbtn.on{font-weight:700}
/* 赤い帯は見出しの上に重ねて出す。出たり消えたりしても、下の画面は1pxも動かさない。 */
.app{position:relative}
.alert{position:absolute;top:0;left:0;right:0;z-index:4;display:flex;align-items:center;justify-content:center;min-height:calc(40px + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) 14px 0;background:var(--danger);color:#fff;font-size:13px;font-weight:700;text-align:center}
.alert[hidden]{display:none}

.seg{flex:none;display:flex;margin:0 12px 10px;border:1px solid var(--blue);border-radius:4px;overflow:hidden}
.seg button{flex:1 1 auto;padding:0 4px;height:36px;font-size:12px;color:var(--blue);white-space:nowrap}
.seg button+button{border-left:1px solid var(--blue)}
.seg button:active{background:#d9eff9}
.seg button.on{background:var(--blue);color:#fff}
.seg b{margin-left:4px;font-variant-numeric:tabular-nums}
.seg b.hot{display:inline-block;min-width:22px;padding:1px 6px;border-radius:11px;background:var(--danger);color:#fff}

main{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;background:var(--bg);border-top:1px solid var(--line)}
.o{max-height:120px;display:grid;grid-template-columns:2.5em minmax(0,1fr) auto;gap:6px;align-items:center;min-height:60px;padding:8px 8px 8px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
/* 未伝達の行は黄色く塗って、白い「済み」の行とひと目で区別する。5分以上待たせた行は赤み。 */
/* まだ伝えていない行。左に黄色い帯、地はごく薄い黄色。前は行全体を濃い黄色で塗っていたが、青いボタンとぶつかって画面がうるさかった。 */
.o.wait{background:#fffbe6;box-shadow:inset 6px 0 0 #f5c400}
.o.wait.old{background:#fff0ec;box-shadow:inset 6px 0 0 var(--danger)}
.o .no{font-weight:700;font-size:22px;font-variant-numeric:tabular-nums}
.o .nm{font-weight:600;font-size:15px;overflow-wrap:anywhere}
.o .nm small{display:block;font-weight:400;font-size:11px;color:var(--muted)}
.o .nm small.late{color:var(--danger);font-weight:700}
.o .r{display:flex;gap:5px;align-items:center}
/* 伝えた行：押したボタンの側から青が広がり、押した文字だけ白抜きでその場に残る。少し見せてから畳む。 */
.o.sent{color:#fff;background:linear-gradient(var(--blue),var(--blue)) right/100% 100% no-repeat;animation:wipe .16s ease-out}
.o.sent .nm small{color:inherit;font-size:13px;font-weight:700}
.o.sent{box-shadow:none}
.o.sent .mk{background:none;border-color:transparent;color:transparent}
.o.sent .mk.got{background:#fff;color:var(--blue)}
.o.sent .x{visibility:hidden}
.o.sent .sq{box-shadow:0 0 0 1px #fff}
.o.sent.out{overflow:hidden;animation:fold .2s ease-in forwards}
@keyframes wipe{from{background-size:0 100%}}
@keyframes fold{to{max-height:0;min-height:0;padding-top:0;padding-bottom:0;opacity:0}}
@media (prefers-reduced-motion:reduce){.o.sent,.o.sent.out{animation:none}}
.o.gone{color:var(--muted)}
.o.gone .no{font-weight:400}
.o.gone .sq{opacity:.45}
.sq{display:inline-block;width:10px;height:10px;margin-right:5px;border-radius:2px}
/* A・B・C。味のタイルと同じ作り（白地、色の線、下だけ太い）にそろえる。塗りつぶすのは押した瞬間と、押したあとだけ。
   前は青い塗りつぶしが行の数×3個並んで、画面でいちばん強い色になっていた。 */
.mk{display:inline-flex;align-items:center;justify-content:center;width:46px;height:44px;border:1px solid var(--blue);border-bottom-width:3px;border-radius:3px;background:var(--panel);color:var(--blue);font-weight:700;font-size:17px}
.mk:active{background:var(--blue);color:#fff}
.x{display:inline-block;width:42px;height:44px;color:var(--muted);font-size:12px}
/* 「渡した」。A・B・C と同じ作りの、横長のボタン。 */
.gv{height:44px;padding:0 10px;border:1px solid var(--blue);border-bottom-width:3px;border-radius:3px;background:var(--panel);color:var(--blue);font-weight:700;font-size:15px;white-space:nowrap}
.gv:active{background:var(--blue);color:#fff}
.link.sm{padding:0 4px;font-size:12px;color:var(--muted)}
.x:active,.link:active{background:#d9eff9;border-radius:3px}
.x.arm,.x.arm:active{background:var(--danger);color:#fff;border-radius:3px;font-size:11px;font-weight:700;line-height:1.25;padding:0}
.link{color:var(--blue);font-size:14px;min-height:44px;padding:0 8px}
.who{display:inline-block;min-width:1.6em;text-align:center;font-weight:700;font-size:17px}
.none{padding:28px 14px;color:var(--muted);font-size:14px;text-align:center}
.none strong{display:block;margin-bottom:6px;font-size:16px;color:var(--ink)}

table{width:100%;border-collapse:collapse;font-size:15px;background:var(--panel)}
td,th{padding:11px 14px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
td:first-child,th:first-child{text-align:left}
th{padding:7px 14px;font-weight:400;font-size:12px;color:var(--muted);background:var(--strip)}
tfoot td{font-weight:700;font-size:18px}
.sub{display:flex;background:var(--panel);border-bottom:1px solid var(--line)}
.sub span{flex:1;padding:9px 0;text-align:center;font-size:12px;color:var(--muted)}
.sub span+span{border-left:1px solid var(--line)}
.sub b{display:block;font-size:20px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
/* 使い方：その場に書いてある一行の説明（.how）と、右上「使い方」で開く手順。 */
.how{padding:6px 14px;font-size:12px;color:var(--ink);background:var(--strip);border-bottom:1px solid var(--line)}
.how b{display:inline-block;min-width:1.5em;height:1.5em;margin-right:6px;border-radius:3px;background:var(--ink);color:#fff;font-weight:700;text-align:center;line-height:1.5em}
.how small{margin-left:10px;font-size:11px;color:var(--muted)}
.pin .how small{display:block;margin:1px 0 0 28px}
.pad .how{margin:-10px -10px 8px;background:none;border-bottom:0;padding-top:8px;padding-bottom:0}
/* いちばん古い未伝達は、どのタブでも・一覧をどこまで送っても、ここに出したままにする。 */
.pin{flex:none;border-top:1px solid var(--line)}
.pin .o{border-bottom:2px solid #d9dde0}
.pin .o.old{border-bottom-color:#d9dde0}
.pin+main{border-top:0}
.tag{display:inline-block;margin-right:6px;padding:0 6px;border-radius:2px;background:var(--ink);color:#fff;font-size:11px;font-weight:700;line-height:1.6}
/* 伝達済み・集計・使い方を開いているときは、未伝達の1件を見出しつきの別枠にして、下の内容と切り離す。 */
.pin.apart{border-bottom:10px solid var(--bg)}
.pin.apart .o,.pin.apart .o.old{border-bottom:1px solid var(--line)}
.pin.apart+main{border-top:1px solid var(--line)}
.pinhead{display:flex;justify-content:space-between;align-items:center;width:100%;min-height:36px;padding:6px 14px;background:#f5c400;color:#2b2500;font-size:13px;font-weight:700;text-align:left}
.pinhead:active{background:#d9ad00}
.pinhead span{font-weight:400;text-decoration:underline}
.hh{margin:0;padding:16px 14px 7px;font-size:16px;font-weight:700;color:var(--ink);background:none;border-bottom:1px solid var(--line)}
.ht{margin:0;padding:12px 14px;background:var(--panel);border-bottom:1px solid var(--line);font-size:15px;-webkit-user-select:text;user-select:text}
.qa{margin:0;background:var(--panel)}
.qa div{padding:10px 14px;border-bottom:1px solid var(--line)}
.qa dt{font-size:13px;color:var(--muted)}
.qa dd{margin:2px 0 0;font-size:15px;font-weight:600}
.x.eg{display:inline-flex;align-items:center;justify-content:center}
.steps{margin:0;padding:0;list-style:none;background:var(--panel)}
.steps li{display:grid;grid-template-columns:2em minmax(0,1fr);gap:6px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);font-size:17px;font-weight:600;-webkit-user-select:text;user-select:text}
.steps li>b{font-size:22px;line-height:1.2}
.steps small{display:block;margin-top:2px;font-size:13px;font-weight:400;color:var(--muted)}
.steps i{display:inline-block;padding:0 6px;border-radius:3px;background:var(--blue);color:#fff;font-style:normal;font-weight:700}
.sheet{position:fixed;top:0;bottom:0;left:0;right:0;z-index:5;display:flex;align-items:center;justify-content:center;padding:calc(20px + env(safe-area-inset-top,0px)) 16px calc(20px + env(safe-area-inset-bottom,0px));background:rgba(22,25,28,.6)}
.sheet .box{display:flex;flex-direction:column;width:100%;max-width:440px;max-height:100%;background:var(--panel);border-radius:6px;overflow:hidden}
.sheet[hidden]{display:none}
/* 札の番号を押す画面。数字のボタンも、味のタイルと同じ作り（白地、線、下だけ太い）。 */
.sheet.low{align-items:flex-end;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.askno{padding:8px 14px 2px;font-size:52px;font-weight:700;line-height:1.2;text-align:center;font-variant-numeric:tabular-nums}
.askno small{margin-left:4px;font-size:20px;font-weight:600}
.askno.empty{color:var(--line)}
.askwarn{margin:0;padding:6px 14px 0;font-size:13px;font-weight:700;color:var(--danger);text-align:center}
.keys{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:10px 12px 12px}
.key{height:58px;border:1px solid var(--f-plain);border-bottom-width:4px;border-radius:3px;background:var(--panel);font-size:26px;font-weight:600}
.key:active{background:var(--f-plain);color:#fff}
.key.fn{font-size:15px;color:var(--muted)}
.key.ok{border-color:var(--blue);background:var(--blue);color:#fff;font-size:19px;font-weight:700}
.key.ok:active{background:var(--blue-press);border-color:var(--blue-press)}
.key.ok:disabled{opacity:.35}
.sheet header{position:relative;justify-content:center;height:46px;padding-top:0;border-bottom:1px solid var(--line)}
.sheet header .helpbtn{position:absolute;right:6px;top:0;height:46px;margin:0;font-size:14px}
.lead{margin:0;padding:18px 14px 6px;font-size:19px;font-weight:700;letter-spacing:.02em}
.stp{border-bottom:1px solid var(--line)}
.st{display:flex;align-items:flex-start;gap:10px;padding:13px 14px 12px;font-size:16px;font-weight:600;line-height:1.45}
.st b{flex:none;width:1.65em;height:1.65em;margin-top:-1px;border-radius:3px;background:var(--ink);color:#fff;font-size:14px;line-height:1.65em;text-align:center}
.eg{border-top:1px solid var(--line);pointer-events:none}
.eg .o.sent{animation:none}
.eg-x{display:inline-flex;align-items:center;justify-content:center}
.egn{margin:0;padding:6px 14px 11px;font-size:12px;color:var(--muted)}
.sheet .body{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.sheet .foot{flex:none;padding:10px;border-top:1px solid var(--line)}
.back{display:block;width:100%;height:48px;margin:0;border-radius:3px;background:var(--blue);color:#fff;font-weight:700}
.back:active{background:#0c5f82}
.cap{padding:7px 14px;font-size:12px;color:var(--muted);background:var(--strip);border-bottom:1px solid var(--line)}

.pad{flex:none;position:relative;padding:10px 10px calc(10px + env(safe-area-inset-bottom,0px));background:var(--strip);border-top:1px solid var(--line)}
.last{display:none}
/* 味ボタンの上の1行。直前に入れた注文と、そこからの秒数（「入れたっけ」を確かめる）。 */
.lines{margin:0 2px 8px;font-size:12px;color:var(--muted);white-space:nowrap}
.lastline{display:flex;align-items:baseline;gap:8px;min-height:26px}
.lines b{font-size:18px;color:var(--ink);font-variant-numeric:tabular-nums}
.lastline .what{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;font-size:15px;font-weight:600;color:var(--ink)}
.lastline em{font-style:normal;font-size:15px;font-variant-numeric:tabular-nums}
.lastline em.fresh{color:var(--blue);font-weight:700}
/* 役割で画面を分ける。会計は「味を押す」と自分が入れた注文だけ。オーダー管理は一覧だけで、味のボタンは出さない。 */
/* オーダー管理の下半分：A・B・C の列。いまそれぞれが頼まれている注文。渡したら、その注文を押す。 */
.cols{display:none}
.app[data-role=order][data-tab=queue] .cols{flex:none;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));height:42%;background:var(--panel);border-top:2px solid var(--ink)}
.col{display:flex;flex-direction:column;min-height:0;border-left:1px solid var(--line)}
.col:first-child{border-left:0}
.col h2{flex:none;display:flex;align-items:baseline;gap:6px;margin:0;padding:5px 8px 4px;font-size:22px;font-weight:700;line-height:1.1;color:var(--blue);background:var(--strip);border-bottom:1px solid var(--line)}
.col h2 small{font-size:11px;font-weight:400;color:var(--muted)}
.col .jobs{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.col p{margin:0;padding:12px 8px;font-size:12px;color:var(--muted)}
.job{display:block;width:100%;min-height:56px;padding:6px 8px 7px;text-align:left;border-bottom:1px solid var(--line)}
.job:active{background:var(--blue);color:#fff}
.job b{display:block;font-size:22px;line-height:1.15;font-variant-numeric:tabular-nums}
.job span{display:block;font-size:12px;font-weight:600;overflow-wrap:anywhere}
.job .sq{width:8px;height:8px;margin-right:3px}
.job small{display:block;font-size:10px;color:var(--muted)}
.job small.late{color:var(--danger);font-weight:700}
.job:active small{color:inherit}
/* 渡した直後：少しのあいだ灰色で残す。まちがえて押したら、もう一度押すと戻る。 */
.job.gave{background:var(--bg);color:var(--muted)}
.job.gave b{font-weight:400;text-decoration:line-through}
.job.gave small{color:var(--blue);font-size:11px}
#pick,#mine{display:none}
.app[data-role=pick] #pick{display:block}
.app[data-role=cash] #mine{display:block}
.app[data-role=pick] .seg,.app[data-role=pick] .pin,.app[data-role=pick] .pad,.app[data-role=pick] #queue,.app[data-role=pick] #done,.app[data-role=pick] #gone,.app[data-role=pick] #sales{display:none}
.app[data-role=cash] .seg,.app[data-role=cash] .pin,.app[data-role=cash] #queue,.app[data-role=cash] #done,.app[data-role=cash] #gone,.app[data-role=cash] #sales{display:none}
.app[data-role=order] .pad{display:none}
#rolebtn{margin-right:0;color:var(--ink)}
#rolebtn[hidden]{display:none}
#rolebtn small{margin-left:4px;font-size:11px;color:var(--blue)}
.roles{display:grid;gap:10px;max-width:560px;margin:0 auto;padding:16px 12px}
.roles p{margin:0 2px 2px;font-size:15px;font-weight:700}
.role{display:block;width:100%;padding:16px 16px 14px;text-align:left;background:var(--panel);border:1px solid var(--blue);border-bottom-width:4px;border-radius:3px}
.role:active{background:var(--blue);color:#fff}
.role b{display:block;font-size:20px}
.role span{display:block;margin-top:3px;font-size:13px;color:var(--muted)}
.role:active span{color:inherit}
.st{display:inline-block;margin-right:6px;padding:0 6px;border-radius:2px;font-size:11px;font-weight:700;line-height:1.6;background:var(--line);color:var(--ink)}
.st.new{background:#f5c400;color:#2b2500}
.st.told{background:var(--blue);color:#fff}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;height:66px;padding:0 2px;background:var(--panel);border:1px solid var(--c);border-bottom-width:4px;border-radius:3px}
.tile .name{font-size:15px;font-weight:600;white-space:nowrap}
.tile .price{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.tile.wide{grid-column:1 / -1;flex-direction:row;gap:10px;height:50px;--c:var(--blue);color:var(--blue)}
.tile.wide .price{color:inherit;opacity:.8}
/* 押したボタンは、その色で塗りつぶす。押した瞬間（:active）と、押したあと（.hit / .sel / .on）で同じ見た目。 */
.tile:active,.tile.hit,.tile.sel,.tile.on{background:var(--c);color:#fff}
.tile[data-id=lemon]:active,.tile.hit[data-id=lemon],.tile.sel[data-id=lemon]{color:var(--ink)}
.tile:active .price,.tile.hit .price,.tile.sel .price,.tile.on .price{color:inherit;opacity:.95}
.tile.hit .price{font-size:14px;font-weight:700}
.tile.on .price{padding:3px 10px;border:1px solid #fff;border-radius:3px;font-size:13px;opacity:1}
/* 番号の表示は、レジの客面ディスプレイと同じ黒地に白。注文ボタンのすぐ上に出す。 */
.toast{position:absolute;z-index:3;left:10px;right:10px;bottom:calc(var(--padh,0px) + 8px);padding:12px 16px;border-radius:3px;background:#16191c;color:#fff;font-weight:700;font-size:18px;text-align:center;pointer-events:none}

/* タブレット・PC（横に広い画面）。お手本のAirレジのiPad画面にならう：
   白い左の列に一覧（下線つきのタブ）、灰色の右の列に味のタイル、見出しは中央。
   右下には客面ディスプレイ風の黒い表示で、直前の注文と今日の合計を出したままにする。スマホの見た目は変えない。 */
/* 幅の狭いスマホ：4つのタブが収まるように詰める。 */
@media (max-width:359px){
  .seg{margin-left:8px;margin-right:8px}
  .seg button{padding:0 1px;font-size:11px;letter-spacing:-.02em}
  .seg b{margin-left:2px}
  .seg b.hot{min-width:18px;padding:1px 4px}
}
/* 背の低い画面（小さいスマホ、アドレスバーが出ているとき）：一覧が1行も残らなくなるので、下の味ボタンを詰める。 */
@media (max-height:640px){
  .pad{padding-top:8px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px))}
  .pad .how{display:none}
  .lines{margin-bottom:6px}
  .tiles{gap:6px}
  .tile{height:54px}
  .tile.wide{height:44px}
}
/* それでも入りきらないほど低いとき（横向きなど）は、味ボタンの側を送れるようにして、ダブルが画面の外に出ないようにする。 */
main{min-height:64px}
.pad{flex:0 1 auto;min-height:0;overflow-y:auto}
@media (min-width:768px) and (min-height:500px){
  .app{display:grid;grid-template-columns:minmax(360px,5fr) 6fr;grid-template-rows:auto auto auto auto minmax(0,1fr);max-width:1180px;border-left:1px solid var(--line);border-right:1px solid var(--line)}
  .app>header{grid-column:1 / -1;grid-row:1;position:relative;height:48px;border-bottom:1px solid var(--line)}
  .app>header h1{position:absolute;left:0;right:0;font-size:16px;text-align:center;pointer-events:none}
  .app>.alert{min-height:48px;font-size:15px}
  .seg{grid-column:1;grid-row:3;margin:0;border:0;border-bottom:1px solid var(--line);border-radius:0}
  .seg button{height:48px;font-size:14px;color:var(--muted);border-bottom:3px solid transparent}
  .seg button+button{border-left:0}
  .seg button.on{background:none;color:var(--blue);font-weight:700;border-bottom-color:var(--blue)}
  .pin{grid-column:1;grid-row:4;border-top:0}
  .app[data-role=order],.app[data-role=pick]{grid-template-columns:minmax(0,1fr)}
  .app[data-role=order][data-tab=queue]{grid-template-rows:auto auto auto auto minmax(0,1fr) 42%}
  .app[data-role=order][data-tab=queue] .cols{grid-column:1;grid-row:6;height:auto}
  .job b{font-size:28px}
  .job span{font-size:15px}
  .job small{font-size:12px}
  .col h2{font-size:26px}
  .app[data-role=order] main,.app[data-role=pick] main{grid-column:1}
  main{grid-column:1;grid-row:5}
  .pad{grid-column:2;grid-row:3 / span 3;display:flex;flex-direction:column;padding:16px;background:var(--bg);border-top:0;border-left:1px solid var(--line)}
  .pad .how{margin:0 0 12px;padding:0;font-size:14px}
  .tiles{gap:10px}
  .tile{height:clamp(84px,14vh,118px);border-bottom-width:5px}
  .tile .name{font-size:20px}
  .tile .price{font-size:14px}
  .tile.hit .price{font-size:17px}
  .tile.wide{height:64px}
  .tile.on .price{font-size:15px}
  .toast{bottom:16px;left:16px;right:16px;padding:14px 16px;font-size:22px}
  .app[data-role=cash] .toast{left:calc(45.5% + 16px)}
  .toast:not([hidden]){display:flex;align-items:center;justify-content:center;min-height:126px}
  .last{display:block;margin-top:auto;padding:14px 18px 12px;border-radius:3px;background:#16191c;color:#fff}
  .last small{display:block;font-size:12px;opacity:.65}
  .last .l1{display:none}
  .last .l2{margin-top:0;padding-top:0;border-top:0}
  .lines{font-size:14px}
  .lines b{font-size:26px}
  .lastline .what,.lastline em{font-size:19px}
  .last .l1 small{flex:0 0 100%}
  .last .l1 b{font-size:40px;line-height:1.15;font-variant-numeric:tabular-nums}
  .last .l1 span{font-size:21px;font-weight:600}
  .last .l1 .ph{font-size:15px;font-weight:400;opacity:.65}
  .last .l2{margin-top:10px;padding-top:9px;border-top:1px solid rgba(255,255,255,.22);font-size:14px;text-align:right}
  .last .l2 b{margin:0 2px 0 6px;font-size:20px;font-variant-numeric:tabular-nums}
}
/* 縦向きのタブレットなど、2分割にすると右が狭い幅では、一覧の幅を固定して味の文字を小さくする。 */
@media (min-width:768px) and (max-width:899px) and (min-height:500px){
  .app{grid-template-columns:390px minmax(0,1fr)}
  .tile .name{font-size:16px}
  .tile .price{font-size:13px}
  .last .l1 b{font-size:32px}
  .last .l1 span{font-size:17px}
}

<body>
<div class="app" id="app" data-role="pick">
  <header><h1>わたあめ帳<span id="day"></span></h1><span class="mode" id="mode"></span><button class="helpbtn" id="rolebtn" data-act="roles" hidden></button><button class="helpbtn" id="helpbtn" data-act="help">使い方</button></header>
  <div class="alert" id="alert" role="alert" hidden></div>
  <nav class="seg" id="seg" aria-label="表示の切り替え"></nav>
  <div class="pin" id="pin"></div>
  <main id="pane">
    <div id="pick"></div>
    <div id="mine"></div>
    <div id="queue"></div>
    <div id="done" hidden></div>
    <div id="gone" hidden></div>
    <div id="sales" hidden></div>
  </main>
  <div class="cols" id="cols"></div>
  <div class="pad">
    <div class="how"><b>1</b>注文された味を押す</div>
    <div class="lines"><div class="lastline" id="lastline"></div></div>
    <div class="tiles" id="tiles"></div>
    <div class="last" id="last"></div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
</div>

<!-- 札の番号：味を押したあとに出る。箱から取った札の番号を押して「決定」。親指が届くよう、画面の下に出す。 -->
<div class="sheet low" id="ask" role="dialog" aria-label="札の番号" hidden>
  <div class="box">
    <header><h1 id="askTitle"></h1><button class="helpbtn" data-act="askOff">やめる</button></header>
    <div class="askno" id="askNo"></div>
    <p class="askwarn" id="askWarn" hidden></p>
    <div class="keys" id="askKeys"></div>
  </div>
</div>

<!-- 使い方は、まわりを暗くして真ん中に出す。暗い所を押しても閉じる。見出しの帯と「とじる」は注文の画面と同じ部品。 -->
<div class="sheet" id="help" role="dialog" aria-label="使い方" hidden>
  <div class="box">
    <header><h1>使い方</h1><button class="helpbtn" data-act="helpOff">とじる</button></header>
    <div class="body" id="helpbody"></div>
    <div class="foot"><button class="back" data-act="helpOff">とじる</button></div>
  </div>
</div>

<script>
(function(){
// Firebase Realtime Database のURL。空のままだと、この端末だけに保存する。
const DB_URL='https://wataame-cho-default-rtdb.asia-southeast1.firebasedatabase.app';
// true にすると日付ごとに番号と集計を分ける（毎日1番から）。
const SPLIT_BY_DATE=true;

const $=s=>document.querySelector(s);
const yen=n=>'¥'+Number(n||0).toLocaleString('ja-JP');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const hms=t=>{const d=new Date(t||0);return d.getHours()+':'+String(d.getMinutes()).padStart(2,'0')+':'+String(d.getSeconds()).padStart(2,'0')};
const hm=t=>{const d=new Date(t||0);return d.getHours()+':'+String(d.getMinutes()).padStart(2,'0')};
const FLAVORS=[
  {id:'plain',name:'プレーン',price:200,c:'--f-plain'},
  {id:'ichigo',name:'いちご',price:300,c:'--f-ichigo'},
  {id:'grape',name:'グレープ',price:300,c:'--f-grape'},
  {id:'blue',name:'ブルーハワイ',price:300,c:'--f-blue'},
  {id:'lemon',name:'レモン',price:300,c:'--f-lemon'},
  {id:'orange',name:'オレンジ',price:300,c:'--f-orange'}
];
const DOUBLE=400, F=Object.fromEntries(FLAVORS.map(f=>[f.id,f]));
// 番号と集計は日付ごとに分ける（毎日1番から）。
function dayKey(){
  if(!SPLIT_BY_DATE)return 'all';
  const d=new Date();return 'd'+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');
}
const root=k=>DB_URL?DB_URL.replace(/\/+$/,'')+'/wataame2/'+k:'';
let DAY=dayKey(), BASE=root(DAY), LS='wataame-cho-next-'+DAY;
const DAYLABEL=(new Date().getMonth()+1)+'/'+new Date().getDate();
const LATE=5*60000; // これより長く未伝達の注文は、時刻を赤い「◯分前」にする。

// server: 保存済みの注文（id→注文）。pend: まだ送れていない変更（id→差分）。
let server={}, pend={}, online=false, loaded=false, es=null, lastBeat=0, t0=Date.now();
let role='pick', ask=null, lastOrder=null, tab='queue', tabAt=0, armAt=0, dblAt=0, stuck=false, pendAt=0, flash={}, dbl=null, armCancel=null, pendT={}, doneT={}, seq=0, chain=Promise.resolve(), lastTap={id:'',t:0}, toastT=0, flushing=false, again=false;

function loadLocal(){try{const x=JSON.parse(localStorage.getItem(LS)||'null');if(x){if(!BASE)server=x.server||{};pend=x.pend||{}}}catch(e){}}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(BASE?{pend}:{server,pend:{}}))}catch(e){}}
function toast(msg,ms){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{t.hidden=true},ms||1600)}
// 入らなかったと分かっている注文。何が入らなかったかを名前で出す。
function fail(o){toast((o?label(o)+' は入っていません。':'保存できなかった。')+'電波を確認してもう一度',4000)}
// 送ったが返事が来なかった注文。入っているかもしれないので、つながり直して一覧を受け取ってから答えを出す。
// （ここで「失敗」と言い切ると、入っていた注文をもう一度入れて二重になる。）
let unsure=[];
function settleUnsure(){
  if(!unsure.length)return;
  const inn=[],out=[];
  unsure.forEach(o=>{const hit=Object.keys(server).map(k=>server[k]).find(x=>x&&x.cid===o.cid);if(hit)inn.push(label(o)+'（'+hit.no+'番）');else out.push(label(o))});
  unsure=[];
  toast((inn.length?'入っていました: '+inn.join('、'):'')+(inn.length&&out.length?'　／　':'')+(out.length?'入っていません: '+out.join('、')+'。もう一度押してください':''),6000);
}

function req(method,path,body,headers){
  const c=new AbortController(),t=setTimeout(()=>c.abort(),5000);
  return fetch(BASE+path,{method,body:body===undefined?undefined:JSON.stringify(body),headers,signal:c.signal,cache:'no-store'}).finally(()=>clearTimeout(t));
}
// 画面に出す番号。札の番号があればそれ、無ければ（札を使わない古いデータなど）通し番号。
const num=o=>o&&o.tag!=null?o.tag:o.no;
const list=()=>Object.keys(server).map(id=>Object.assign({},server[id],pend[id],{id})).filter(o=>o&&o.no!=null);
const nextNo=()=>Object.keys(server).reduce((a,id)=>Math.max(a,Number(server[id]&&server[id].no)||0),0)+1;

// 送信に失敗したら、すぐ「つながらない」扱いにしてつなぎ直す。次に押した注文を長く待たせないため。
function lost(){if(online){online=false;renderMode();connect()}}

// 番号そのものをキーにして「まだ無いときだけ書く」ので、2台同時でも同じ番号にはならない。
async function addRemote(o){
  let no=nextNo(),net=0;
  for(let i=0;i<60;i++){
    o.no=no;let r;
    try{r=await req('PUT','/orders/n'+no+'.json',o,{'if-match':'null_etag'})}
    catch(e){lost();if(++net>=2){e.unsure=true;throw e}await sleep(500);continue}
    if(r.ok){server['n'+no]=Object.assign({},o);return}
    if(r.status===412){
      let cur=null;try{cur=await r.json()}catch(e){}
      if(cur){server['n'+no]=cur;if(cur.cid===o.cid)return}
      no=Math.max(no+1,nextNo());continue;
    }
    throw new Error('http '+r.status);
  }
  throw new Error('busy');
}
async function addOrder(o){
  if(BASE){if(!loaded||!online)throw new Error('offline');await addRemote(o)}
  else{o.no=nextNo();server['n'+o.no]=o;saveLocal()}
}
function patchOrder(id,patch){
  if(BASE){pend[id]=Object.assign({},pend[id],patch);if(!pendAt){pendAt=Date.now();setTimeout(renderMode,2600)}saveLocal();render();flush()}
  else{if(server[id])Object.assign(server[id],patch);saveLocal();render()}
}
// 送れていない変更を順に再送する。失敗したら残しておき、次の機会にもう一度。
async function flush(){
  if(!BASE)return;
  if(flushing){again=true;return}
  flushing=true;
  do{
    again=false;
    for(const id of Object.keys(pend)){
      const snap=JSON.stringify(pend[id]);
      let r;
      try{r=await req('PATCH','/orders/'+id+'.json',pend[id])}catch(e){stuck=true;again=false;lost();break}
      if(!r.ok){stuck=true;again=false;break}
      if(server[id])Object.assign(server[id],JSON.parse(snap));
      if(JSON.stringify(pend[id])===snap)delete pend[id];else again=true;
    }
  }while(again);
  if(!Object.keys(pend).length){stuck=false;pendAt=0}
  saveLocal();flushing=false;render();
}

function setPath(path,data){
  const seg=path.split('/').filter(Boolean);
  if(!seg.length){server=data||{};return}
  let t=server;
  for(let i=0;i<seg.length-1;i++){if(typeof t[seg[i]]!=='object'||t[seg[i]]===null)t[seg[i]]={};t=t[seg[i]]}
  const k=seg[seg.length-1];
  if(data===null)delete t[k];else t[k]=data;
}
function beat(){lastBeat=Date.now();if(!online){online=true;flush()}}
function connect(){
  if(es)es.close();
  lastBeat=Date.now();
  es=new EventSource(BASE+'/orders.json');
  es.addEventListener('put',e=>{const m=JSON.parse(e.data);setPath(m.path,m.data);loaded=true;beat();render();if(m.path==='/')settleUnsure()});
  es.addEventListener('patch',e=>{const m=JSON.parse(e.data);Object.keys(m.data||{}).forEach(k=>setPath(m.path+'/'+k,m.data[k]));beat();render()});
  es.addEventListener('keep-alive',()=>{beat();renderMode()});
  es.onerror=()=>{online=false;renderMode();if(es.readyState===2){const me=es;setTimeout(()=>{if(es===me)connect()},3000)}};
}

const flv=o=>Array.isArray(o.flavors)?o.flavors:Object.values(o.flavors||{});
const live=()=>list().filter(o=>o.status!=='cancel');
const fl=o=>flv(o).map(f=>F[f]?F[f].name:f).join('＋');
const label=o=>(o.kind==='double'?'ダブル ':'')+fl(o);
const dots=o=>flv(o).map(f=>'<i class="sq" style="background:var('+(F[f]?F[f].c:'--line')+')"></i>').join('');

// 一覧の並びが変わって行が動いたら、そこから少しの間、行のボタン（A・B・C、取消、戻す）を受け付けない。
// 伝えた行が消えて下の行が繰り上がった瞬間や、もう1台の操作で行がずれた瞬間に押すと、狙ったのと別の注文に当たるため。
let guardUntil=0,snap=[];const sig={};
function moved(key,ids,appendOnly){
  const prev=sig[key]||'',now=ids.join(',');sig[key]=now;
  if(prev===now||!prev)return;
  if(appendOnly&&now.indexOf(prev)===0)return; // 下に足されただけなら、上の行は動いていない
  guardUntil=Date.now()+450;
  // 動く直前の、ボタンの位置と注文の対応を覚えておく。直後のタップは「動く前にそこにあった注文」を押したものとして扱う。
  // 人は0.3秒ほど前に見た位置を狙って押すので、こうすると狙った注文に当たる。ただ無視すると、続けて押したタップが抜ける。
  snap=[...document.querySelectorAll('#pin [data-act=told],#queue [data-act=told],#done [data-act=give],#cols [data-act=give]')].map(el=>{const r=el.getBoundingClientRect();return {a:el.dataset.act,id:el.dataset.id,m:el.dataset.m,l:r.left,t:r.top,r:r.right,b:r.bottom}});
}
// 中身が変わったときだけ書き換える。他の端末の更新で、押している最中のボタンが作り直されてタップが消えるのを防ぐ。
function put(el,html){if(el.__h!==html){el.__h=html;el.innerHTML=html}}
// 直前の注文（いちばん新しい1件）と、そこからの経過。1分までは秒で数える。
function lastOf(){let m=null;live().forEach(o=>{if(!m||o.createdAt>m.createdAt)m=o});return m}
function sinceText(ms){const s=Math.max(0,Math.floor(ms/1000));return s<60?s+'秒前':s<3600?Math.floor(s/60)+'分'+(s%60)+'秒前':Math.floor(s/3600)+'時間前'}
function renderLines(){
  const o=lastOf();
  put($('#lastline'),o?'<span>直前の注文</span><b>'+esc(num(o))+'番</b><span class="what">'+esc(label(o))+'</span><em id="since"></em>':'<span>直前の注文</span><span class="what">まだありません</span>');
  tick();
}
function tick(){
  if(dbl&&Date.now()-dblAt>20000){dbl=null;renderTiles()}
  const el=$('#since'),o=el&&lastOf();if(!o)return;
  const ms=Date.now()-o.createdAt,t=sinceText(ms);
  if(el.textContent!==t)el.textContent=t;
  el.classList.toggle('fresh',ms<10000);
}
function renderTiles(){
  // ダブルの案内はダブルのボタンの中に出す。上に行を足すと、押そうとしたボタンがずれるため。
  put($('#tiles'),FLAVORS.map(f=>{
    const first=dbl&&dbl[0]===f.id,going=pendT[f.id]>0,done=doneT[f.id];
    const sub=going?'送信中':done?done.no+'番':first?'1つ目':dbl?'':'¥'+f.price;
    return '<button class="tile'+(going||done?' hit':first?' sel':'')+'" style="--c:var('+f.c+')" data-act="pick" data-id="'+f.id+'"><span class="name">'+f.name+'</span>'+(sub?'<span class="price">'+sub+'</span>':'')+'</button>';
  }).join('')+(dbl
    ?'<button class="tile wide on" data-act="dbl"><span class="name">ダブル　'+(dbl.length?esc(F[dbl[0]].name)+'＋2つ目を選ぶ':'1つ目を選ぶ')+'</span><span class="price">やめる</span></button>'
    :'<button class="tile wide" data-act="dbl"><span class="name">ダブル</span><span class="price">¥'+DOUBLE+'</span></button>'));
}
function row(o,now,oldest){
  if(flash[o.id])return '<div class="o sent'+(flash[o.id].out?' out':'')+'"><span class="no">'+esc(num(o))+'</span><span class="nm">'+dots(o)+esc(fl(o))+'<small>✓ '+esc(flash[o.id].m)+' に伝えた</small></span><span class="r">'+['A','B','C'].map(m=>'<span class="mk'+(m===flash[o.id].m?' got':'')+'">'+m+'</span>').join('')+'<span class="x"></span></span></div>';
  const late=now-o.createdAt>LATE,when=late?Math.floor((now-o.createdAt)/60000)+'分前':hm(o.createdAt);
  return '<div class="o wait'+(late?' old':'')+'"><span class="no">'+esc(num(o))+'</span>'
    +'<span class="nm">'+dots(o)+esc(fl(o))+'<small'+(late?' class="late"':'')+'>'+(o.kind==='double'?'ダブル　':'')+(oldest?'<span class="tag">次に伝える</span>':'')+when+'</small></span>'
    +'<span class="r">'+['A','B','C'].map(m=>'<button class="mk" data-act="told" data-m="'+m+'" data-id="'+esc(o.id)+'" aria-label="製造'+m+'に伝えた">'+m+'</button>').join('')
    +(armCancel===o.id?'<button class="x arm" data-act="cancel2" data-id="'+esc(o.id)+'">本当に<br>消す</button>':'<button class="x" data-act="cancel" data-id="'+esc(o.id)+'" aria-label="'+esc(num(o))+'番を取り消す">取消</button>')
    +'</span></div>';
}
function renderQueue(){
  const w=list().filter(o=>o.status==='new'||flash[o.id]).sort((a,b)=>a.no-b.no),now=Date.now();
  const how='<div class="how"><b>2</b>作る人に声をかけたら、その相手のボタンを押す<small>部室棟側の人から順に A、B、C</small></div>';
  // いちばん古い1件は上に固定し、残りを一覧に並べる。
  const here=tab==='queue',n=w.filter(o=>!flash[o.id]).length;
  moved('queue',w.map(o=>o.id),true);
  $('#pin').classList.toggle('apart',!here&&w.length>0);
  put($('#pin'),here?how+(w.length?row(w[0],now,w.length>1):'')
    :w.length?'<button class="pinhead" data-act="tab" data-id="queue">伝えてない注文 '+n+'件　次はこれ<span>一覧を見る</span></button>'+row(w[0],now,false):'');
  put($('#queue'),w.length>1?w.slice(1).map(o=>row(o,now,false)).join('')
    :'<div class="none">'+(BASE&&!loaded?'読み込み中':w.length?'伝えてない注文はこの1件だけです':'<strong>伝えてない注文はありません</strong>味を押すと、番号がついてここに出ます')+'</div>');
}
function renderDone(){
  const all=list(),now=Date.now();
  // 札の番号順に並べる。作る人が「37番できた」と言ったとき、番号で探すので。
  const d=all.filter(o=>o.status==='told').sort((a,b)=>num(a)-num(b)||a.no-b.no);
  const g=all.filter(o=>o.status==='done').sort((a,b)=>(b.doneAt||0)-(a.doneAt||0));
  if(tab==='done')moved('done',d.map(o=>o.id).concat('|',g.slice(0,30).map(o=>o.id),all.some(o=>o.status==='new')?'pin':''),false);
  const cancel=o=>armCancel===o.id?'<button class="x arm" data-act="cancel2" data-id="'+esc(o.id)+'">本当に<br>消す</button>':'<button class="x" data-act="cancel" data-id="'+esc(o.id)+'" aria-label="'+esc(num(o))+'番を取り消す">取消</button>';

// その番号の札が、まだ外にあるはずか（渡したを押していない注文が持っている）。
function tagInUse(n){return list().find(o=>num(o)===n&&(o.status==='new'||o.status==='told'))}
function askKey(a,id){
  if(!ask)return;
  if(a==='k'){if(ask.d.length<3&&!(ask.d===''&&id==='0'))ask.d+=id;ask.warn=null}
  else if(a==='kdel'){ask.d=ask.d.slice(0,-1);ask.warn=null}
  else if(a==='kok'){
    const n=Number(ask.d);if(!n)return;
    const dup=tagInUse(n);
    // 同じ番号の札がまだ外にあるはずなら、一度止める。打ちまちがいか、「渡した」の押し忘れ。
    // 合っていれば、もう一度「決定」。札は手元にあるのだから、前の注文は渡し終わっている。押し忘れとして「渡した」にしておく。
    if(dup&&!ask.warn){ask.warn=n+'番の札は、まだ渡していないことになっています（'+label(dup)+'）。合っていれば、もう一度「決定」';if(navigator.vibrate)navigator.vibrate([60,60,60]);renderAsk();return}
    if(dup&&dup.status==='told')patchOrder(dup.id,{status:'done',doneAt:Date.now(),auto:true});
    const k=ask;ask=null;renderAsk();take(k.kind,k.flavors,n);return;
  }
  renderAsk();
}

// 押した味をすぐ塗りつぶし、保存は裏で順番に行う。続けて押した分は待たせずに受け付ける。
function take(kind,flavors,tag){
  const ids=flavors.filter((f,i)=>flavors.indexOf(f)===i);
  const o={no:0,tag,kind,flavors,total:kind==='double'?DOUBLE:F[flavors[0]].price,status:'new',createdAt:Date.now(),cid:Date.now().toString(36)+Math.random().toString(36).slice(2,8)};
  ids.forEach(i=>{pendT[i]=(pendT[i]||0)+1;delete doneT[i]});
  dbl=null;tab='queue';render();
  if(navigator.vibrate)navigator.vibrate(20);
  chain=chain.then(async()=>{
    let ok=true,maybe=false;try{await addOrder(o)}catch(e){ok=false;maybe=!!(e&&e.unsure)}
    // 返事は来なかったが、一覧にはもう届いている（＝入っている）なら、成功として扱う。
    if(maybe){const hit=Object.keys(server).map(k=>server[k]).find(x=>x&&x.cid===o.cid);if(hit){o.no=hit.no;ok=true;maybe=false}}
    ids.forEach(i=>{
      pendT[i]--;
      if(ok){const k=++seq;doneT[i]={no:num(o),k};setTimeout(()=>{if(doneT[i]&&doneT[i].k===k){delete doneT[i];renderTiles()}},1200)}
    });
    if(ok){lastOrder={no:num(o),label:label(o)};toast(num(o)+'番　'+label(o))}
    else if(maybe){unsure.push(o);toast(label(o)+' が入ったか確認中。つながるまで待ってください',5000)}
    else fail(o);
    render();if(ok&&role==='cash')$('#pane').scrollTop=0;else if(ok&&tab==='queue')toBottom();
  });
}

document.addEventListener('click',e=>{
  if(e.target.id==='help'){e.target.hidden=true;return}
  if(e.target.id==='ask'){ask=null;renderAsk();return}
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  const a=b.dataset.act;let id=b.dataset.id,mk=b.dataset.m;
  // 行が動いた直後：伝える・渡したは、動く前にその位置にあった注文として扱う。戻す・取消は安全側に倒して受け付けない。
  if(role==='order'&&Date.now()<guardUntil&&(a==='told'||a==='give'||a==='undo'||a==='cancel'||a==='cancel2')){
    const hit=(a==='told'||a==='give')&&snap.find(i=>i.a===a&&e.clientX>=i.l&&e.clientX<=i.r&&e.clientY>=i.t&&e.clientY<=i.b);
    const o=hit&&list().find(x=>x.id===hit.id);
    if(!o||o.status!==(a==='told'?'new':'told')||flash[o.id])return;
    id=hit.id;mk=hit.m;
  }
  if(a==='pick'){
    // 同じボタンの二重タップ（0.25秒以内）は1回として扱う。
    const now=Date.now();if(lastTap.id===id&&now-lastTap.t<250)return;lastTap={id,t:now};
    if(dbl){dblAt=Date.now();dbl.push(id);if(dbl.length===2)openAsk('double',dbl.slice());else renderTiles()}else openAsk('single',[id])
  }
  else if(a==='k'||a==='kdel'||a==='kok')askKey(a,id);
  else if(a==='askOff'){ask=null;renderAsk()}
  else if(a==='role'){setRole(id);render();$('#pane').scrollTop=0}
  else if(a==='roles'){setRole('pick');render();$('#pane').scrollTop=0}
  else if(a==='help'){put($('#helpbody'),HELP);$('#help').hidden=false;$('#helpbody').scrollTop=0}
  else if(a==='helpOff')$('#help').hidden=true;
  else if(a==='dbl'){dbl=dbl?null:[];dblAt=Date.now();renderTiles()}
  else if(a==='tab'){tab=id;tabAt=Date.now();sig.done='';render();$('#pane').scrollTop=0}
  else if(a==='give'){
    const o=list().find(x=>x.id===id);if(navigator.vibrate)navigator.vibrate(30);
    gave[id]=Date.now();setTimeout(()=>{if(gave[id]&&Date.now()-gave[id]>=2400){delete gave[id];render()}},2600);
    patchOrder(id,{status:'done',doneAt:Date.now()});toast((o?num(o)+'番　':'')+'渡した');
  }
  else if(a==='ungive'){const o=list().find(x=>x.id===id);delete gave[id];patchOrder(id,{status:'told'});toast((o?num(o)+'番を':'')+'「まだ渡してない」に戻した')}
  else if(a==='told'){
    // 押した行をしばらく青く残して、誰に伝えたかを見せてから伝達済みへ送る。
    const m=mk,o=list().find(x=>x.id===id);
    const f=flash[id]={m,out:false};
    setTimeout(()=>{if(flash[id]===f){f.out=true;renderQueue()}},900);
    setTimeout(()=>{if(flash[id]===f){delete flash[id];render()}},1120);
    if(navigator.vibrate)navigator.vibrate(40);
    toast((o?num(o)+'番　':'')+m+' に伝えた');
    patchOrder(id,{status:'told',maker:m,toldAt:Date.now()});
  }
  else if(a==='undo'){
    // 1つ前の段階に戻す。渡した → まだ渡してない、まだ渡してない → まだ伝えてない。取り消した注文は、取り消す前の状態に戻す。
    const o=list().find(x=>x.id===id);
    const to=!o?'new':o.status==='done'?'told':o.status==='cancel'?(o.was==='told'?'told':'new'):'new';
    patchOrder(id,{status:to});toast((o?num(o)+'番を':'')+(to==='told'?'「まだ渡してない」に戻した':'「まだ伝えてない」に戻した'));
  }
  else if(a==='cancel'){armCancel=id;armAt=Date.now();render();setTimeout(()=>{if(armCancel===id){armCancel=null;render()}},3000)}
  else if(a==='cancel2'){
    if(Date.now()-armAt<400)return;
    const o=list().find(x=>x.id===id);armCancel=null;patchOrder(id,{status:'cancel',cancelAt:Date.now(),was:o?o.status:'new'});toast((o?num(o)+'番を':'')+'取り消した');
  }
});

// 画面のどこかをさわっている間は、自動で切り替えない。
document.addEventListener('pointerdown',()=>{tabAt=Date.now()},{passive:true});
// 伝達済み・集計を開いたまま15秒さわらなければ、未伝達があるときは未伝達に戻す。
setInterval(()=>{if(tab!=='queue'&&tab!=='help'&&!armCancel&&Date.now()-tabAt>15000&&list().some(o=>o.status==='new')){tab='queue';render();$('#pane').scrollTop=0}},3000);
if(BASE){
  connect();
  // Firebaseは30秒ごとに keep-alive を送る。途絶えたらつなぎ直す。
  setInterval(()=>{if(rollover())return;if(Date.now()-lastBeat>45000){online=false;connect()}flush();render()},15000);
  setInterval(rollover,2000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)wake()});
  window.addEventListener('online',wake);
  window.addEventListener('pageshow',e=>{if(e.persisted)wake()});
}
})();
</script>
</body>
</html>
